name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping server so the free instance does not sleep
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then curl -fsS -m 60 "${{ vars.SITE_URL }}/healthz" || true; fi
